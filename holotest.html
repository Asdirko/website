<!DOCTYPE html>
  <html>
    
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>Stuff</title>
      <link rel="stylesheet" href="css/maintheme.css">
      <link rel="icon" type="image/x-icon" href="assets/webassets/favicon.png">
    </head>

  <body> 
    <div class="holo-card"></div>



</body>
<style>
.holo-card {
  width: 220px;
  height: 300px;
  border-radius: 16px;
  background: linear-gradient(135deg, #1a1a2e, #2d2d44);
  position: relative;
  overflow: hidden;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.1s;
  box-shadow: 0 20px 50px rgba(0,0,0,0.5);
}

/* Overlay holographique */
.holo-card::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(
    125deg,
    #ff0080, #ff8c00, #40e0d0, #7b68ee,
    #ff0080, #ff8c00, #40e0d0, #7b68ee,
    #ff0080, #ff8c00, #40e0d0
  );
  background-size: 200% 200%;
  opacity: 0;
  mix-blend-mode: color-dodge;
  transition: opacity 0.3s;
  animation: holoGradient 5s ease infinite;
  pointer-events: none;
}

/* Holographic grid */
.holo-card::after {
  content: '';
  position: absolute;
  inset: 0;
  background:
    repeating-linear-gradient(
      0deg,
      transparent, transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 4px
    ),
    repeating-linear-gradient(
      90deg,
      transparent, transparent 2px,
      rgba(255,255,255,0.03) 2px,
      rgba(255,255,255,0.03) 4px
    );
  opacity: 0;
  transition: opacity 0.3s;
  pointer-events: none;
}

/* Activation on hover */
.holo-card:hover::before { opacity: 0.7; }
.holo-card:hover::after { opacity: 1; }

@keyframes holoGradient {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

</style>

<script>
const card = document.querySelector('.holo-card');

card.addEventListener('mousemove', (e) => {
  const rect = card.getBoundingClientRect();
  const x = e.clientX - rect.left;
  const y = e.clientY - rect.top;

  // Calculate rotation (-15 to 15 degrees)
  const centerX = rect.width / 2;
  const centerY = rect.height / 2;
  const rotateX = (y - centerY) / centerY * -15;
  const rotateY = (x - centerX) / centerX * 15;

  card.style.transform =
    `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
});

card.addEventListener('mouseleave', () => {
  card.style.transform = 'perspective(1000px) rotateX(0) rotateY(0)';
});
</script>
