        <style>
            

            :root {
                --header-image: url('https://fisheye.neocities.org/assets/header.png');

            @font-face {

                src: url('https://fisheye.neocities.org/fonts/csoftreg.otf');
            }
            
            @font-face {
                font-family: csoft;
                src: url('https://fisheye.neocities.org/fonts/csoftbold.otf');

            }
            
            @font-face {
                font-family: Strasua;

            @font-face {

            @font-face {

            @font-face {

            body {
               
                margin: 0;
                background-color: #000000;
                
                background-size: 65px;
                color: #000000;
                background-image: var(--body-bg-image);
                background-size: cover;
                background-repeat no-repeat;
                
                
            }

            * {
                box-sizing: border-box;
            }

            


            
            #container {
                max-width: 900px;
                
                margin: 0 auto;
                
            }

            
            #container a {
                color: #000000;
                font-weight: bold;
                text-decoration: none;
                
                
                
            }

            #header {
                width: 100%;
                background-color: #FFFFFF;
                
                height: 125px;
                
                background-image: var(--header-image);
                background-size: 100%;
                background-position: left;
                
            }

            
            #navbar {
                height: 40px;
                background-color: #faebcc;
               
                width: 100%;
                border-radius: 0px 0px 5px 5px;
            }

            #navbar ul {
                display: flex;
                padding: 0;
                margin: 0;
                list-style-type: none;
                justify-content: space-evenly;
            }

            #navbar li {
                padding-top: 10px;
                transition:all 1s ease;
                display: table-cell;
                
            }

            
            #navbar a {
                color: black;
                
                font-weight: 800;
                text-decoration: none;
                display:block;
                transition:color 0.3s ease-in-out;
                
            }

            
            #navbar li:hover a{
                color: #008543;
                
                
            }
            
            
                

            #flex {
                display: flex;
                
                
            }

            
            aside {
                
                width: 175px;
                margin-right: 15px;
                
                font-size: smaller;
                
                background-color: #dbc7a6;
                
            }


            
            main {
                
                
                opacity: 1;
                flex: 1;
                
                
                order: 2;
                border-radius: 5px 5px 5px 5px;
            }

            

            #leftSidebar {
                order: 1;
            }

            #rightSidebar {
                order: 3;
            }

            footer {
                display: flex;
                background-color: #faebcc;
                
                width: 100%;
                height: 40px;
                padding: 5px;
                
                border-radius: 5px 5px 5px 5px;
                justify-content:center;
                align-items:center;
                
            }

            h1,
            h2,
            h3 {
                color: #000000;
            }

            h1 {
                font-size: 25px;
            }

            
            strong {
                
                color: #000000;
            }

            
            .box {
                background-color: #dbc7a6;
                
                padding: 10px;
                border-radius: 5px;
                
            }
            .todobox {
                background-color: #dbc7a6;
                height: 105px;
                width: auto;
                
                padding: 10px;
                border-radius: 5px;
                
            }
            
            .scrollbox {
                background-color: #dbc7a6;
                
                padding: 10px;
                border-radius: 5px;
                height: 400px;
                overflow: scroll;
                
            }
            
            
            
            .narrow {
            float: right;
            width: 175px;
            background-color: #dbc7a6;
            
            height: 500px;
            
            
            border-radius: 5px;
            margin-left: 15px;
            
                
                
            }
            
            .wide {
              
            float: left;
            width: calc(100% - 190px);
            background-color: #dbc7a6;
            height: auto;
            padding: 10px;
            
            
            
            border-radius: 5px;
            
            }
            
            
                
            
            .badge {
              display: inline-block;
              position: absolute;
              top:30px;
              right: calc(50% + 185px);
              transform: rotate(4deg);
              
            }
            
            
            
            
            .logo {
              
              height:100%;
              position: absolute;
              top: 15px;
              left: 15%;
              
            }
            
            .tabon {
              background-color: #faebcc;
                width: 145px;
                font-size: smaller;
                border-radius: 5px 5px 5px 5px;
                height: 50px;
                margin-bottom: 15px;
                margin-left: 15px;
                margin-right: 15px;

                text-align: center;
                vertical-align: 50px;
                line-height: 50px;  
                font-size: 17px;
                
                
                
            }
            
            .taboff {
              background-color: #dbc7a6;
                width: 145px;
                font-size: smaller;
                border-radius: 5px 5px 5px 5px;
                height: 50px;
                margin-bottom: 15px;
                margin-right: 15px;
                margin-left: 15px;
                text-align: center;
                vertical-align: 50px;
                line-height: 50px;  
                font-size: 17px;
                
            }
            
            .imgtxt {
  width: fit-content;
  height: fit-content;
  display: inline-block;
  position: relative;
}
.imgtxt span {
  opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 99;
  font-size: 2.5rem;
  color: #FFF;
  filter: drop-shadow(1px 1px 0 black) 
    drop-shadow(-1px 1px 0 black)
    drop-shadow(1px -1px 0 black)
    drop-shadow(-1px -1px 0 black);
}
.imgtxt:hover span, .imgtxt:focus span {
  opacity: 1;
}
.imgtxt:hover img, .imgtxt:focus img {
  
}

            @media only screen and (max-width: 800px) {
                #flex {
                    flex-wrap: wrap;
                }

                aside {
                    width: 100%;
                }

                
                main {
                    order: 1;
                }

                #leftSidebar {
                    order: 2;
                }

                #rightSidebar {
                    order: 3;
                }

                #navbar ul {
                    flex-wrap: wrap;
                }
