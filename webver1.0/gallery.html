        <style>
            

            :root {
                --header-image: url('https://fisheye.neocities.org/assets/header.png');
                --body-bg-image: url('https://fisheye.neocities.org/assets/gallerybg.png');
 
            }
                
                
                --content: #43256E;
            }

            
    

            @font-face {
                font-family: csoft;
                src: url('https://fisheye.neocities.org/fonts/csoftreg.otf');
            }
            
            @font-face {
                font-family: csoft;
                src: url('https://fisheye.neocities.org/fonts/csoftbold.otf');
                font-weight: bold;
            }

            @font-face {
                font-family: Goudy;
                src: url('https://fisheye.neocities.org/fonts/Goudy.otf');
            }
          

            

            body {
               
                margin: 0;
                background-color: #000000;
                
                background-size: 65px;
                color: #000000;
                background-image: var(--body-bg-image);
                background-size: cover;
                background-repeat no-repeat;
                background-attachment: fixed;
                
                
            }

            * {
                box-sizing: border-box;
            }
 #container {
  max-width: 800px;
  margin: 0 auto;
}

            
            #container a {
                color: #000000;
                font-weight: bold;
                text-decoration: none;
                
                
                
            }

#header { 
  width: 100%;
  background-color: #FFFFFF;
  height: 125px;
  background-image: var(--header-image);
  background-size: 100%;
  background-position: left;
  border-radius: 5px 5px 0px 0px;
}

            
            #navbar {
                height: 40px;
                background-color: #faebcc;
               
                width: 100%;
                border-radius: 0px 0px 5px 5px;
            }

            #navbar ul {
                display: flex;
                padding: 0;
                margin: 0;
                list-style-type: none;
                justify-content: space-evenly;
            }

            #navbar li {
                padding-top: 10px;
                transition:all 1s ease;
                display: table-cell;
                
            }

            
            #navbar a {
                color: black;
                
                font-weight: 800;
                text-decoration: none;
                display:block;
                transition:color 0.3s ease-in-out;
                
            }

            
            #navbar li:hover a{
                color: #008543;
                
                
            }
            
            
                

            #flex {
                display: flex;
                
                
            }

            
            aside {
                
                width: 175px;
                
                font-size: smaller;
                
                opacity: 1;
                
            }


            
            main {
                
                
                background-color: #faebcc;
                flex: 1;
                padding: 10px;
                
                
                order: 2;
                border-radius: 5px 5px 5px 5px;
            }

            

            #leftSidebar {
                order: 1;
            }

            #rightSidebar {
                order: 3;
            }

            footer {
                display: flex;
                background-color: #faebcc;
                
                width: 100%;
                height: 40px;
                padding: 5px;
                
                border-radius: 5px 5px 5px 5px;
                justify-content:center;
                align-items:center;
                
            }

            h1,
            h2,
            h3 {
                color: #000000;
            }

            h1 {
                font-size: 25px;
            }

            
            strong {
                
                color: #000000;
            }

            
            .box {
                background-color: #dbc7a6;
                
                padding: 10px;
                border-radius: 5px;
            }
                
 
            .logo {
              
              height:100%;
              position: absolute;
              top: 15px;
              left: 15%;
              
            }
  
            .imgtxt {
  width: fit-content;
  height: fit-content;
  display: inline-block;
  position: relative;
}
.imgtxt span {
  opacity: 0;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  z-index: 99;
  font-size: 2.5rem;
  color: #FFF;
  filter: drop-shadow(1px 1px 0 black) 
    drop-shadow(-1px 1px 0 black)
    drop-shadow(1px -1px 0 black)
    drop-shadow(-1px -1px 0 black);
}
.imgtxt:hover span, .imgtxt:focus span {
  opacity: 1;
}
.imgtxt:hover img, .imgtxt:focus img {
  
}



.thumbnail {
  
  width: 142px; 
  height: 200px;
  overflow: clip;
  border-radius: 5px;
  float: left;
  margin-left: 5px;
  margin-right: 5px;
  margin-top: 5px;
  margin-bottom: 5px;
  
}
.thumbnail:hover {
  box-shadow: 0 0 2px 1px rgba(0, 140, 186, 0.5);
}

/* Add a hover effect (blue shadow) */

                
                
            
            
            
            
            
            
  
            

            #topBar {
                width: 100%;
                height: 30px;
                padding: 10px;
                font-size: smaller;
                background-color: #13092D;
            }
            
            


            

            @media only screen and (max-width: 800px) {
                #flex {
                    flex-wrap: wrap;
                }

                aside {
                    width: 100%;
                }

                
                main {
                    order: 1;
                }

                #leftSidebar {
                    order: 2;
                }

                #rightSidebar {
                    order: 3;
                }

                #navbar ul {
                    flex-wrap: wrap;
                }
            }
        </style>
