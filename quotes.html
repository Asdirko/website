<script>
    var quotes = [
  "The strain of anti-intellectualism has been a constant thread winding its way through our political and cultural life, nurtured by the false notion that democracy means that 'my ignorance is just as good as your knowledge.' ― Isaac Asimov",
  "The only way to deal with an unfree world is to become so absolutely free that your very existence is an act of rebellion. - Albert Camus,",
  "Art is an act of the soul, not the intellect. When we are dealing with people's dreams - their visions, really - we are in the realm of the sacred. We are involved with forces and energies larger than our own. We are engaged in a sacred transaction of which we know only a little: the shadow, not the shape. -Julia Cameron",
  "The only thing an old man can tell a young man is that it goes fast, real fast, and if you’re not careful it’s too late. Of course, the young man will never understand this truth. - Norm MacDonald ",
  "If you want to be a grocer, or a general, or a politician, or a judge, you will invariably become it; that is your punishment. If you never know what you want to be, if you live what some might call the dynamic life but what I will call the artistic life, if each day you are unsure of who you are and what you know you will never become anything, and that is your reward. ― Oscar Wilde ",
];

let quoteText = document.querySelector(".quote_text");

function generateQuote() {
  var randomIndex = Math.floor(Math.random() * quotes.length);
  var quote = quotes[randomIndex]
  quoteText.innerHTML = '"' + quote + '"'
}
</script>
